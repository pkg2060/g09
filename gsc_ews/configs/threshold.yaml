# 학습 점수로 보정할 임계값 설정. 공통값 위에 모델별 값을 적용한다.
method: percentile         # manual | percentile | sigma | pot
default: 0.2
per_variable: {}            # 특성명 또는 0부터 시작하는 인덱스로 지정한다.
percentile: 99.5
sigma_k: 3.0
pot_risk: 0.0001
pot_init_quantile: 0.98     # 학습 점수에서 꼬리를 분리하는 분위수
pot_multiplier: 1.0

model_overrides:
  tranad:
    method: manual
    default: 0.2
  tranad_v2:
    method: percentile
  tft:
    method: pot
